name: Commit Lint

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate commit messages
        run: |
          git log origin/${{ github.base_ref }}..HEAD --pretty=format:%s | \
          grep -E "^(feat|fix|chore|docs|ci|refactor|test|security):" || \
          (echo "❌ Invalid commit format" && exit 1)