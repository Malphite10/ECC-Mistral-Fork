name: Reusable Test Suite

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"

      run-lint:
        required: false
        type: boolean
        default: true

      run-tests:
        required: false
        type: boolean
        default: true

jobs:
  test:
    name: Test + Lint Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        if: ${{ inputs.run-lint == true }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ inputs.run-tests == true }}
        run: npm test

      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/