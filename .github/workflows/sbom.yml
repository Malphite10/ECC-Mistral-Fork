name: SBOM Generation

on:
  workflow_call:

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.xml

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml